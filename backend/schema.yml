components:
  schemas:
    BankProcessingConfiguration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bank:
          type: integer
        bank_name:
          type: string
          readOnly: true
        percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,4})?$
        minimum_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        application_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bank
      - bank_name
      - created_at
      - id
      - updated_at
    BankProcessingConfigurationRequest:
      type: object
      properties:
        bank:
          type: integer
        percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,4})?$
        minimum_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        application_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - bank
    CalculationTypeEnum:
      enum:
      - fixed
      - percentage_minimum
      - conditional
      type: string
      description: |-
        * `fixed` - Fixed amount
        * `percentage_minimum` - Percentage with minimum
        * `conditional` - Conditional value
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        legal_entity_name:
          type: string
          maxLength: 255
        tax_registration_number:
          type: string
          maxLength: 100
        showroom_address:
          type: string
        main_contact_mobile:
          type: string
          maxLength: 30
        default_currency:
          type: string
          maxLength: 10
        default_regional_spec:
          type: string
          maxLength: 100
        is_active:
          type: boolean
        branches:
          type: array
          items:
            $ref: '#/components/schemas/CompanyBranch'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branches
      - created_at
      - id
      - legal_entity_name
      - updated_at
    CompanyBranch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: integer
        name:
          type: string
          maxLength: 255
        address:
          type: string
        contact_mobile:
          type: string
          maxLength: 30
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - created_at
      - id
      - name
      - updated_at
    CompanyBranchRequest:
      type: object
      properties:
        company:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
        contact_mobile:
          type: string
          maxLength: 30
        is_active:
          type: boolean
      required:
      - company
      - name
    CompanyRequest:
      type: object
      properties:
        legal_entity_name:
          type: string
          minLength: 1
          maxLength: 255
        tax_registration_number:
          type: string
          maxLength: 100
        showroom_address:
          type: string
        main_contact_mobile:
          type: string
          maxLength: 30
        default_currency:
          type: string
          minLength: 1
          maxLength: 10
        default_regional_spec:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
      required:
      - legal_entity_name
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        role:
          $ref: '#/components/schemas/RoleEnum'
        profile_image:
          type: string
          readOnly: true
        is_active:
          type: boolean
      required:
      - email
      - first_name
      - id
      - profile_image
    CurrentUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CurrentUser'
      required:
      - data
      - success
    ExpensePreset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        expense_type:
          type: string
          maxLength: 80
        calculation_type:
          $ref: '#/components/schemas/CalculationTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,4})?$
          nullable: true
        minimum_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        condition_key:
          type: string
          maxLength: 80
        condition_value:
          type: string
          maxLength: 80
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - expense_type
      - id
      - name
      - updated_at
    ExpensePresetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        expense_type:
          type: string
          minLength: 1
          maxLength: 80
        calculation_type:
          $ref: '#/components/schemas/CalculationTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,4})?$
          nullable: true
        minimum_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        condition_key:
          type: string
          maxLength: 80
        condition_value:
          type: string
          maxLength: 80
        is_active:
          type: boolean
      required:
      - expense_type
      - name
    FirstPartyRoleEnum:
      enum:
      - COMPANY
      - CUSTOMER
      - SUPPLIER
      - OTHER
      type: string
      description: |-
        * `COMPANY` - Company
        * `CUSTOMER` - Customer
        * `SUPPLIER` - Supplier
        * `OTHER` - Other
    InsuranceBand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        minimum_vehicle_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        maximum_vehicle_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        no_license_surcharge:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - maximum_vehicle_price
      - minimum_vehicle_price
      - name
      - updated_at
    InsuranceBandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        minimum_vehicle_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        maximum_vehicle_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        no_license_surcharge:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - amount
      - maximum_vehicle_price
      - minimum_vehicle_price
      - name
    LoginData:
      type: object
